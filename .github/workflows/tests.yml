name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Structural benchmark
        run: python -m entropy_demo.eval --tasks data/tasks.json --mode isolated --out .run/ci-core.json
      - name: Pitfalls benchmark
        run: python -m entropy_demo.eval --tasks data/tasks_pitfalls_100.json --config configs/pitfalls_benchmark.json --mode isolated --out .run/ci-pitfalls.json
      - name: Require complete benchmark passes
        shell: python
        run: |
          import json
          from pathlib import Path
          for filename, expected_total in [('ci-core.json', 8), ('ci-pitfalls.json', 100)]:
              summary = json.loads((Path('.run') / filename).read_text())['summary']
              assert summary['tasks_total'] == expected_total, summary
              assert summary['core_pass'] == expected_total, summary
